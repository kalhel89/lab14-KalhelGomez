name: Build and publish .NET application

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore lab11-KalhelGomez.sln

      - name: Build application
        run: dotnet build lab11-KalhelGomez.sln --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish lab11-KalhelGomez/lab11-KalhelGomez.csproj --configuration Release --output ./published --no-restore

      - name: Upload published files
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./published

      - name: Trigger Render deploy
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl --fail --silent --show-error "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL is not configured; skipping Render deployment."
          fi
